title = "dexArbTrading Gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Encrypted dotenv files and non-secret dotenv templates"
paths = [
  '''(^|/)\.env(?:\..*)?\.enc$''',
  '''(^|/)\.env(?:\..*)?\.example$''',
]

[[allowlists]]
description = "Generated OpenAPI embeddings are compressed base64, not live secrets"
paths = [
  '''(^|/)internal/api/gen/.+\.gen\.go$''',
]
