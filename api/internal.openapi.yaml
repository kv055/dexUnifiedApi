openapi: 3.1.0
info:
  title: dexUnifiedApi internal API
  version: 1.0.0
  description: Private service and operational contract. This handwritten specification is the source of truth.
  contact:
    name: dexPendulum maintainers
    url: https://github.com/kv055/dexPendulum
servers:
  - url: http://localhost:5010
tags:
  - name: accounts
  - name: bisq-execution
  - name: cex-permissions
  - name: health
  - name: live-offers
  - name: payment-notifications
  - name: raw
paths:
  /api/accounts/health_check:
    post:
      operationId: postApiAccountsHealthCheck
      tags:
        - accounts
      summary: POST /api/accounts/health_check
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/plain:
              schema:
                type: string
      description: POST /api/accounts/health_check
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /health:
    get:
      operationId: getHealth
      tags:
        - health
      summary: GET /health
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Core database tables are not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/plain:
              schema:
                type: string
      description: GET /health
      security: []
  /internal/bisq/requote:
    post:
      operationId: postInternalBisqRequote
      tags:
        - bisq-execution
      summary: POST /internal/bisq/requote
      responses:
        "200":
          description: Requoted Bisq route for the current server policy and offer
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid Bisq route quote
        "409":
          description: Bisq route cannot be requoted from current server policy and offer
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/plain:
              schema:
                type: string
      description: POST /internal/bisq/requote
      security:
        - internalSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - offer_id
                - provider
                - trade_mode
                - fiat_currency
                - trade_amount_sats
                - total_to_pay_sats
                - security_deposit_sats
                - taker_fee_sats
                - mining_fee_sats
                - volume_as_long
                - funding_fee_cap_sats
              properties:
                offer_id:
                  type: string
                provider:
                  type: string
                trade_mode:
                  type: string
                fiat_currency:
                  type: string
                trade_amount_sats:
                  type: integer
                total_to_pay_sats:
                  type: integer
                security_deposit_sats:
                  type: integer
                taker_fee_sats:
                  type: integer
                mining_fee_sats:
                  type: integer
                volume_as_long:
                  type: integer
                funding_fee_cap_sats:
                  type: integer
  /internal/cex_permissions:
    get:
      operationId: getInternalCexPermissions
      tags:
        - cex-permissions
      summary: GET /internal/cex_permissions
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/plain:
              schema:
                type: string
      description: GET /internal/cex_permissions
      security:
        - internalSecret: []
  /internal/execution-quotes:
    post:
      operationId: postInternalExecutionQuotes
      tags:
        - live-offers
      summary: Create an authoritative execution quote for a custom trade size
      description: >-
        Same handler as the session-gated POST /api/execution-quotes. dexMonitor's
        dashboard proxy calls this route: it has already checked the browser
        session and authenticates with X-Internal-Secret instead of a cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/plain:
              schema:
                type: string
      security:
        - internalSecret: []
  /internal/live_offers:
    post:
      operationId: postInternalLiveOffers
      tags:
        - live-offers
      summary: POST /internal/live_offers
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "202":
          description: Live-offer refresh accepted; enrichment continues in the background
        "204":
          description: Live-offer refresh accepted with no response body
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/plain:
              schema:
                type: string
      description: POST /internal/live_offers
      security:
        - internalSecret: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /internal/payment_notifications:
    post:
      operationId: postInternalPaymentNotifications
      tags:
        - payment-notifications
      summary: POST /internal/payment_notifications
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "202":
          description: Payment notification accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/plain:
              schema:
                type: string
      description: POST /internal/payment_notifications
      security:
        - internalSecret: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
  /internal/ws/live_offers:
    get:
      operationId: getInternalWsLiveOffers
      tags:
        - raw
      summary: GET /internal/ws/live_offers
      responses:
        "101":
          description: WebSocket protocol upgrade
        default:
          description: Error response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/plain:
              schema:
                type: string
      description: GET /internal/ws/live_offers
      security:
        - internalSecret: []
      x-raw-reason: Internal WebSocket upgrade and frame streaming require the raw response writer.
components:
  securitySchemes:
    dashboardSession:
      type: apiKey
      in: cookie
      name: dex_session
    internalSecret:
      type: apiKey
      in: header
      name: X-Internal-Secret
    webhookSecret:
      type: apiKey
      in: header
      name: X-Webhook-Secret
    bearerWebhook:
      type: http
      scheme: bearer
    telegramSecret:
      type: apiKey
      in: header
      name: X-Telegram-Bot-Api-Secret-Token
  schemas:
    APIError:
      $ref: ../../commons/api/openapi/APIError.yaml
    Health:
      $ref: ../../commons/api/openapi/Health.yaml
